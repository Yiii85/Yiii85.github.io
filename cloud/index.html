<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름의 여정 · 구름 속의 낙서</title>
<meta property="og:title" content="구름의 여정">
<meta property="og:description" content="바람이 받는 사람을 정하는 익명 낙서.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#0d1b2a;color:#1b2430}
  #map{position:fixed;inset:0}
  .card{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .msg{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 6px}
  .num{font-size:30px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
  .sub{font-size:14px;color:#5b6573;margin:2px 0}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;text-align:center;padding:12px 8px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none}
  .primary{background:#5a8fd8;color:#fff}.ghost{background:#eef2f7;color:#2c3a4d}
  .brand{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;background:rgba(255,255,255,.85);border-radius:999px;
         padding:8px 14px;font-size:13px;font-weight:700;color:#4b6fa6}
  .glow{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0 18%,rgba(255,210,115,.55) 30%,rgba(255,210,115,0) 70%);
        animation:breathe 1.8s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scale(.8)}to{transform:scale(1.35)}}
  .cloud{font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .flag{width:16px;height:16px;border-radius:50%;background:#f28c59;border:3px solid #fff}
  .lines{margin:8px 0 0;padding:0;list-style:none}
  .lines li{font-size:13.5px;color:#5b6573;margin:3px 0;line-height:1.4}
  .play{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:12px;border:0;
        background:rgba(20,30,45,.85);color:#fff;font-size:18px}
  .when{margin-top:10px;font-size:14px;font-weight:600;color:#2c3a4d}
  .empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="map"></div>
<div class="brand">☁ 구름 속의 낙서</div>
<button class="play" id="play" hidden aria-label="여정 다시 보기">▶</button>
<div class="card" id="card" hidden>
  <p class="msg" id="msg"></p>
  <p class="num" id="num"></p>
  <p class="sub" id="sub"></p>
  <p class="sub" id="reads"></p>
  <ul class="lines" id="lines"></ul>
  <a class="btn ghost" id="whenBtn" style="display:block;margin-top:12px">내 하늘에는 언제 와?</a>
  <p class="when" id="when" hidden></p>
  <div class="btns">
    <a class="btn primary" id="open">앱에서 열기</a>
    <a class="btn ghost" id="get" hidden>앱 받기</a><!-- 테스트플라이트/앱스토어 주소가 생기면 여기에 -->
  </div>
</div>
<div class="empty" id="empty" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA = "https://rxkwlglfmeyghygdisog.supabase.co";
const KEY = "sb_publishable_0ti4jz1VqkIs4ufQKfElaQ_Sl7pJdwo";
const id = new URLSearchParams(location.search).get("id");
const km = (a,b)=>{const dn=(b.lat-a.lat)*111.32, de=(b.lon-a.lon)*111.32*Math.cos(a.lat*Math.PI/180);return Math.hypot(dn,de)};
const kmText = k => k < 10 ? k.toFixed(1)+"km" : Math.round(k)+"km";
function span(c){
  const end = c.ended_at ? new Date(c.ended_at) : new Date();
  const m = Math.max(0, Math.floor((end - new Date(c.created_at))/60000));
  if (m < 60) return Math.max(1,m)+"분";
  if (m < 2880) return Math.floor(m/60)+"시간";
  return Math.floor(m/1440)+"일 "+Math.floor((m%1440)/60)+"시간";
}
// 위치 → "경기도", "인천", "일본" (도·광역시 단위, 앱 여정 화면과 같은 굵기)
const nameCache={};
async function placeName(lat,lon){
  const k=lat.toFixed(2)+","+lon.toFixed(2); if(k in nameCache) return nameCache[k];
  try{
    const j=await (await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=ko")).json();
    let n = j.countryCode==="KR" ? (j.principalSubdivision||"") : (j.countryName||"");
    n = n.replace(/(특별자치시|특별자치도|광역시|특별시)$/,"").replace(/^대한민국$/,"");
    return nameCache[k] = n || null;
  }catch(e){ return nameCache[k]=null }
}
// 부채 구름 화면 (글귀는 사용자 허락받은 것, 2026-11-06)
async function fanMode(c, map, ll, gone){
  const to=[c.fan_to.lat, c.fan_to.lon];
  L.polyline([ll[ll.length-1], to],{color:"#fff",weight:3,dashArray:"4 8",opacity:.8}).addTo(map);
  L.marker(to,{icon:L.divIcon({className:"",html:'<div class="flag" style="background:#5a8fd8"></div>',iconSize:[22,22]})}).addTo(map);
  map.fitBounds(L.latLngBounds(ll.concat([to])).pad(.5),{maxZoom:12});
  const toName = await placeName(c.fan_to.lat, c.fan_to.lon);
  const nowName = await placeName(c.now.lat, c.now.lon);
  const msg=document.getElementById("msg"), num=document.getElementById("num"), sub=document.getElementById("sub");
  document.getElementById("reads").textContent="";
  document.getElementById("whenBtn").style.display="none";
  const lines=[];
  if (c.fan_arrived || new Date(c.fan_arrive_at) <= new Date()) {
    msg.textContent = "구름이 도착했어요. "+(toName||"그곳")+" 하늘을 올려다보세요";
    num.textContent = "";
    sub.textContent = gone ? "이 구름은 이제 하늘에서 흩어졌어요" : "";
  } else {
    msg.textContent = "당신에게 낙서가 담긴 구름이 출발했어요";
    const d=new Date(c.fan_arrive_at);
    const f=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric",hour:"numeric"}).format(d);
    num.textContent = "도착 예정: "+f+"쯤";
    num.style.fontSize="22px";
    sub.textContent = nowName ? "지금 "+nowName+" 하늘을 지나고 있어요" : "지금 바다 위를 지나고 있어요";
    lines.push("도착하기 전에 미리 앱을 받아 두세요");
  }
  document.getElementById("lines").innerHTML = lines.map(()=>"<li></li>").join("");
  [...document.querySelectorAll("#lines li")].forEach((li,i)=>li.textContent=lines[i]);
  document.getElementById("open").href = "clouddoodle://cloud/"+c.id;
  document.getElementById("card").hidden=false;
}
function empty(t){document.getElementById("empty").hidden=false;document.getElementById("empty").textContent=t}
async function main(){
  if(!id){empty("구름 링크가 올바르지 않아요");return}
  const r = await fetch(SUPA+"/rest/v1/rpc/public_journey",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})});
  const c = await r.json();
  if(!c||!c.id){empty("이 구름은 찾을 수 없어요");return}
  const pts = [c.start, ...c.path.map(p=>({lat:p.lat,lon:p.lon})), c.now];
  const map = L.map("map",{zoomControl:false,attributionControl:true});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {attribution:"Esri, Maxar"}).addTo(map);
  // 위성 사진 위에 지명 (절대 규칙: 위성 사진 + 지명, 그림 지도 없음)
  // 한국 안은 브이월드 한글 지명, 한국 밖은 Esri 지명 (2026-11-06 사용자 결정)
  const VW = "674CE1E0-6B96-420A-A15F-B849EC7F90A9";   // 브이월드 개발키 (만료 2027-05-06, 출시 전 운영키로)
  const KR = L.latLngBounds([33.0,124.5],[38.65,131.0]);
  const EMPTY = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const Places = L.TileLayer.extend({ getTileUrl(c){
    if (c.z >= 6) {   // 가운데가 한국 안인 칸은 브이월드(한글)가 맡음
      const n = Math.pow(2,c.z), lon=x=>x/n*360-180,
            lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
      const tb = L.latLngBounds([lat(c.y+1),lon(c.x)],[lat(c.y),lon(c.x+1)]);
      if (KR.contains(tb.getCenter())) return EMPTY;
    }
    return L.TileLayer.prototype.getTileUrl.call(this,c);
  }});
  new Places("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {opacity:.9}).addTo(map);
  L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+VW+"/Hybrid/{z}/{y}/{x}.png",
    {minZoom:6, maxZoom:19, bounds:KR, attribution:"브이월드"}).addTo(map);
  const ll = pts.map(p=>[p.lat,p.lon]);
  L.polyline(ll,{color:"#fff",weight:12,opacity:.25}).addTo(map);
  const line = L.polyline(ll,{color:"#fff",weight:4,dashArray:"8 6"}).addTo(map);
  L.marker(ll[0],{icon:L.divIcon({className:"",html:'<div class="flag"></div>',iconSize:[22,22]})}).addTo(map);
  (c.reads||[]).forEach(p=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:'<div class="glow"></div>',iconSize:[28,28]})}).addTo(map));
  const cloudMk = L.marker(ll[ll.length-1],{icon:L.divIcon({className:"",html:'<div class="cloud">☁️</div>',iconSize:[40,40]})}).addTo(map);
  map.fitBounds(L.latLngBounds(ll.concat((c.reads||[]).map(p=>[p.lat,p.lon]))).pad(.6),{maxZoom:12});
  const gone = c.status !== "floating";
  // 2026-11-08: 흩어지면 낙서는 영원히 사라짐 (글귀 허락받음)
  document.getElementById("msg").textContent = c.message || (c.has_drawing ? "그림 낙서" : (gone ? "흩어지며 낙서도 함께 사라졌어요" : "빈 구름"));
  document.getElementById("num").textContent = span(c)+" · "+kmText(km(c.start, c.now));   // 앱과 같은 방식(출발점→지금 자리)
  document.getElementById("sub").textContent = (c.place_name ? c.place_name+"에서 띄운 구름" : "어딘가에서 띄운 구름")
     + (gone ? " · 여행을 마치고 흩어졌어요" : " · 지금도 바람 따라 흘러가는 중");
  document.getElementById("reads").textContent = c.read_count > 0 ? c.read_count+"명이 이 구름을 읽었어요" : "아직 아무도 읽지 않았어요";
  // 부채로 보낸 구름 링크: 받는 사람에게 "출발했어요 · 도착 예정 · 지금 어디쯤" (낙서 내용은 하늘에서 읽도록 숨김)
  if (c.fan_count) { await fanMode(c, map, ll, gone); return; }

  // 지나온 곳 · 지금 위치 · 비를 만난 곳 · 흩어진 곳 (앱 여정 화면과 같은 내용, 지도에는 표시하지 않고 글로만)
  const lines = [];
  const passed = [];
  const add = n => { if (n && passed[passed.length-1] !== n) passed.push(n) };
  const step = Math.max(1, Math.floor(c.path.length / 10));
  const samples = [c.start, ...c.path.filter((_,i)=>i%step===0), c.now];
  const names = await Promise.all(samples.map(p=>placeName(p.lat,p.lon)));
  names.forEach(add);
  const nowName = names[names.length-1];
  if (passed.length >= 2) lines.push("🗺 "+passed.join(" → ")+" 하늘을 지나왔어요");
  if (!gone) lines.push(nowName ? "📍 지금 "+nowName+" 하늘에 떠 있어요" : "📍 지금 바다 위에 떠 있어요");
  let was=false;
  for (const p of c.path){ if(p.rained && !was){ const n=await placeName(p.lat,p.lon); lines.push("🌧 "+(n? n+" 하늘에서":"가는 길에")+" 비를 만나 낙서가 빗속에 내렸어요") } was=p.rained }
  if (gone) lines.push(nowName ? "☁ "+nowName+" 하늘에서 흩어졌어요" : "☁ 바다 위에서 흩어졌어요");
  document.getElementById("lines").innerHTML = lines.map(t=>"<li></li>").join("");
  [...document.querySelectorAll("#lines li")].forEach((li,i)=>li.textContent=lines[i]);

  // 되감기 재생: 출발지부터 지금 자리까지 7초
  const playBtn=document.getElementById("play"); playBtn.hidden=false;
  playBtn.onclick=()=>{
    const t0=performance.now(), dur=7000;
    const cum=[0]; for(let i=1;i<ll.length;i++) cum.push(cum[i-1]+km({lat:ll[i-1][0],lon:ll[i-1][1]},{lat:ll[i][0],lon:ll[i][1]}));
    const total=cum[cum.length-1]||1;
    function frame(now){
      const f=Math.min(1,(now-t0)/dur), d=f*total; let i=1; while(i<ll.length-1 && cum[i]<d) i++;
      const k=(d-cum[i-1])/((cum[i]-cum[i-1])||1), a=ll[i-1], b=ll[i];
      const pos=[a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k];
      line.setLatLngs(ll.slice(0,i).concat([pos])); cloudMk.setLatLng(pos);
      if(f<1) requestAnimationFrame(frame); else { line.setLatLngs(ll); cloudMk.setLatLng(ll[ll.length-1]) }
    }
    requestAnimationFrame(frame);
  };

  // 내 하늘에는 언제 오나: 지금 바람이 그대로 분다고 보고, 내 자리 5km 안에 들어오는 시각
  const whenBtn=document.getElementById("whenBtn"), whenP=document.getElementById("when");
  if (gone) whenBtn.style.display = "none";   // 흩어진 구름은 올 일이 없음
  whenBtn.onclick=()=>{
    if(!navigator.geolocation){ whenP.hidden=false; whenP.textContent="위치를 알 수 없어서 계산하지 못했어요"; return }
    navigator.geolocation.getCurrentPosition(pos=>{
      const me={lat:pos.coords.latitude, lon:pos.coords.longitude};
      const pe=(c.now.lon-me.lon)*111320*Math.cos(me.lat*Math.PI/180), pn=(c.now.lat-me.lat)*111320;
      const u=c.wind_u||0, v=c.wind_v||0, ww=u*u+v*v, r=5000, dist=Math.hypot(pe,pn);
      whenP.hidden=false;
      if (dist<=r){ whenP.textContent="지금 네 하늘 근처에 떠 있어요"; return }
      if (ww<0.25){ whenP.textContent="바람이 거의 없어서 지금은 한자리에 머물러 있어요"; return }
      const b=2*(pe*u+pn*v), disc=b*b-4*ww*(dist*dist-r*r);
      const t= disc>=0 ? (-b-Math.sqrt(disc))/(2*ww) : -1;
      if (t>0){ const h=t/3600; whenP.textContent="이 바람이면 약 {시간} 뒤 네 하늘에 닿아요".replace("{시간}", h<1 ? Math.max(5,Math.round(t/300)*5)+"분" : Math.round(h)+"시간") }
      else { const tc=Math.max(0,-(pe*u+pn*v)/ww), cx=pe+u*tc, cy=pn+v*tc;
             whenP.textContent="이 바람으로는 네 하늘을 비껴가요 (가장 가까울 때 {거리})".replace("{거리}", kmText(Math.hypot(cx,cy)/1000)) }
    }, ()=>{ whenP.hidden=false; whenP.textContent="위치를 알 수 없어서 계산하지 못했어요" }, {enableHighAccuracy:false, timeout:10000});
  };

  document.getElementById("open").href = "clouddoodle://cloud/"+c.id;
  document.getElementById("card").hidden=false;
}
main().catch(()=>empty("구름을 불러오지 못했어요"));
</script>
</body>
</html>
