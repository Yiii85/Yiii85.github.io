<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름의 여정 · 구름 위의 낙서</title>
<meta property="og:title" content="구름의 여정">
<meta property="og:description" content="바람이 받는 사람을 정하는 익명 낙서. 카톡은 1초, 구름은 사흘.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#0d1b2a;color:#1b2430}
  #map{position:fixed;inset:0}
  .card{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .msg{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 6px}
  .num{font-size:30px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
  .sub{font-size:14px;color:#5b6573;margin:2px 0}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;text-align:center;padding:12px 8px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none}
  .primary{background:#5a8fd8;color:#fff}.ghost{background:#eef2f7;color:#2c3a4d}
  .brand{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;background:rgba(255,255,255,.85);border-radius:999px;
         padding:8px 14px;font-size:13px;font-weight:700;color:#4b6fa6}
  .glow{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0 18%,rgba(255,210,115,.55) 30%,rgba(255,210,115,0) 70%);
        animation:breathe 1.8s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scale(.8)}to{transform:scale(1.35)}}
  .cloud{font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .flag{width:16px;height:16px;border-radius:50%;background:#f28c59;border:3px solid #fff}
  .empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="map"></div>
<div class="brand">☁ 구름 위의 낙서</div>
<div class="card" id="card" hidden>
  <p class="msg" id="msg"></p>
  <p class="num" id="num"></p>
  <p class="sub" id="sub"></p>
  <p class="sub" id="reads"></p>
  <div class="btns">
    <a class="btn primary" id="open">앱에서 열기</a>
    <a class="btn ghost" id="get" hidden>앱 받기</a><!-- 테스트플라이트/앱스토어 주소가 생기면 여기에 -->
  </div>
</div>
<div class="empty" id="empty" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA = "https://rxkwlglfmeyghygdisog.supabase.co";
const KEY = "sb_publishable_0ti4jz1VqkIs4ufQKfElaQ_Sl7pJdwo";
const id = new URLSearchParams(location.search).get("id");
const km = (a,b)=>{const dn=(b.lat-a.lat)*111.32, de=(b.lon-a.lon)*111.32*Math.cos(a.lat*Math.PI/180);return Math.hypot(dn,de)};
const kmText = k => k < 10 ? k.toFixed(1)+"km" : Math.round(k)+"km";
function span(c){
  const end = c.ended_at ? new Date(c.ended_at) : new Date();
  const m = Math.max(0, Math.floor((end - new Date(c.created_at))/60000));
  if (m < 60) return Math.max(1,m)+"분";
  if (m < 2880) return Math.floor(m/60)+"시간";
  return Math.floor(m/1440)+"일 "+Math.floor((m%1440)/60)+"시간";
}
function empty(t){document.getElementById("empty").hidden=false;document.getElementById("empty").textContent=t}
async function main(){
  if(!id){empty("구름 링크가 올바르지 않아요");return}
  const r = await fetch(SUPA+"/rest/v1/rpc/public_journey",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})});
  const c = await r.json();
  if(!c||!c.id){empty("이 구름은 찾을 수 없어요");return}
  const pts = [c.start, ...c.path.map(p=>({lat:p.lat,lon:p.lon})), c.now];
  const map = L.map("map",{zoomControl:false,attributionControl:true});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {attribution:"Esri, Maxar"}).addTo(map);
  const ll = pts.map(p=>[p.lat,p.lon]);
  L.polyline(ll,{color:"#fff",weight:12,opacity:.25}).addTo(map);
  L.polyline(ll,{color:"#fff",weight:4,dashArray:"8 6"}).addTo(map);
  L.marker(ll[0],{icon:L.divIcon({className:"",html:'<div class="flag"></div>',iconSize:[22,22]})}).addTo(map);
  (c.reads||[]).forEach(p=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:'<div class="glow"></div>',iconSize:[28,28]})}).addTo(map));
  L.marker(ll[ll.length-1],{icon:L.divIcon({className:"",html:'<div class="cloud">☁️</div>',iconSize:[40,40]})}).addTo(map);
  map.fitBounds(L.latLngBounds(ll.concat((c.reads||[]).map(p=>[p.lat,p.lon]))).pad(.6),{maxZoom:12});
  document.getElementById("msg").textContent = c.message || (c.has_drawing ? "그림 낙서" : "빈 구름");
  document.getElementById("num").textContent = span(c)+" · "+kmText(km(c.start, c.now));   // 앱과 같은 방식(출발점→지금 자리)
  const gone = c.status !== "floating";
  document.getElementById("sub").textContent = (c.place_name ? c.place_name+"에서 띄운 구름" : "어딘가에서 띄운 구름")
     + (gone ? " · 여행을 마치고 흩어졌어요" : " · 지금도 바람 따라 흘러가는 중");
  document.getElementById("reads").textContent = c.read_count > 0 ? c.read_count+"명이 이 구름을 읽었어요" : "아직 아무도 읽지 않았어요";
  document.getElementById("open").href = "clouddoodle://cloud/"+c.id;
  document.getElementById("card").hidden=false;
}
main().catch(()=>empty("구름을 불러오지 못했어요"));
</script>
</body>
</html>
